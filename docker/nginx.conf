server {
  listen 6055;
  listen [::]:6055;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The Three.js chunk is ~918 kB before compression, so gzip matters here.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Vite emits content-hashed filenames, so these are safe to cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The atlas is a single-page app and keeps its reading frame in the query
  # string, so any path that is not a real file falls back to the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # No server version disclosure in response headers.
  server_tokens off;
}
