services:
  atlas:
    build:
      context: .
    image: bobiverse-atlas:local
    container_name: bobiverse-atlas
    ports:
      - "6055:6055"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6055/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
