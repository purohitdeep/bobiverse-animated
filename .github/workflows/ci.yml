name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the full quality gate
        run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -t bobiverse-atlas:ci .
      - name: Smoke test the served atlas on 6055
        run: |
          docker run -d --name atlas-ci -p 6055:6055 bobiverse-atlas:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6055/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:6055/ | grep -q '<div id="root">' || {
                echo "index.html did not render the app shell"; exit 1;
              }
              echo "atlas served on 6055"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs atlas-ci; exit 1
